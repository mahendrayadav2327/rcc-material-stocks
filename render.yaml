services:
  - type: web
    name: rcc-material-stocks
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DB_FILE
        value: /data/rcc_stocks.db
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
    disk:
      name: rcc-data
      mountPath: /data
      sizeGB: 1
